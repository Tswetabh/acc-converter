[pytest]
testpaths = tests/unit
addopts = -v --tb=short
markers =
    integration: marks tests that load real ML models / require network access
    slow: marks tests that are deliberately slow (benchmarks etc.)
filterwarnings =
    ignore::FutureWarning:transformers
    ignore::UserWarning:transformers
    ignore::UserWarning:speechbrain
    ignore::FutureWarning:speechbrain
    ignore::UserWarning:torchaudio
    ignore::FutureWarning:torch.jit
    ignore::FutureWarning:silero_vad
    ignore::UserWarning:silero_vad
