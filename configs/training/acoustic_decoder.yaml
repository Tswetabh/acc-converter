# Configuration for training the Neural Acoustic Decoder
model:
  content_dim: 768
  speaker_dim: 192
  mel_dim: 80
  hidden_dim: 512
  n_conv_blocks: 4
  kernel_size: 5
  dropout: 0.1

mel:
  sample_rate: 16000
  n_fft: 1024
  win_length: 1024
  hop_length: 256
  n_mels: 80
  f_min: 0.0
  f_max: 8000.0

training:
  batch_size: 16
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  val_split: 0.1
  device: cuda
